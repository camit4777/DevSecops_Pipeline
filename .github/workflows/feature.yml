# .github/workflows/feature.yml
name: CI Pipeline

on:
  push:
    branches:
      - master
      # add feature/** here too if you want this to run on feature branches as well

env:
  DOCKER_IMAGE: ankit1111/petapp:${{ github.sha }}
  MAVEN_OPTS: "-DskipTests=true"

jobs:
  build:
    uses: ./.github/workflows/javabuild.yml
    secrets: inherit

  sonar:
    uses: ./.github/workflows/sonar.yml
    needs: build # Ensures Sonar runs after build succeeds
    secrets: inherit

  test:
    uses: ./.github/workflows/test.yml
    needs: sonar
    secrets: inherit

  imagepush:
    uses: ./.github/workflows/imagepush.yml
    needs: test
    secrets: inherit
